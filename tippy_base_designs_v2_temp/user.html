<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Base Portfolio &amp; Identity — Tippy</title>
  <style>

    :root {
      --bg: #ffffff;
      --bg-subtle: #f7f7f8;
      --surface: #ffffff;
      --surface-2: #f2f2f4;
      --surface-hover: #eaecef;
      --border: #e4e4e7;
      --border-strong: #c8c8ce;
      --text: #111111;
      --text-muted: #52525b;
      --text-dim: #71717a;
      --brand: #0000ff;
      --brand-hover: #0000cc;
      --brand-fg: #ffffff;
      --brand-tint: rgba(0, 0, 255, 0.07);
      --brand-border: rgba(0, 0, 255, 0.35);
      --yes: #047857;
      --yes-bg: rgba(4, 120, 87, 0.09);
      --yes-border: rgba(4, 120, 87, 0.35);
      --no: #be123c;
      --no-bg: rgba(190, 18, 60, 0.09);
      --no-border: rgba(190, 18, 60, 0.35);
      --warn: #b45309;
      --warn-bg: rgba(180, 83, 9, 0.10);
      --font-sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
      --ease: cubic-bezier(0.2, 0, 0, 1);
    }
    [data-theme="dark"] {
      --bg: #111111;
      --bg-subtle: #161618;
      --surface: #111111;
      --surface-2: #1a1a1e;
      --surface-hover: #222228;
      --border: #26262c;
      --border-strong: #3c3c46;
      --text: #ffffff;
      --text-muted: #a1a1aa;
      --text-dim: #71717a;
      --brand: #224bff;
      --brand-hover: #4266ff;
      --brand-fg: #ffffff;
      --brand-tint: rgba(34, 75, 255, 0.14);
      --brand-border: rgba(34, 75, 255, 0.50);
      --yes: #34d399;
      --yes-bg: rgba(52, 211, 153, 0.12);
      --yes-border: rgba(52, 211, 153, 0.38);
      --no: #fb7185;
      --no-bg: rgba(251, 113, 133, 0.12);
      --no-border: rgba(251, 113, 133, 0.38);
      --warn: #fbbf24;
      --warn-bg: rgba(251, 191, 36, 0.14);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }
    button, input, select { font-family: inherit; color: inherit; }
    .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
    .num { font-variant-numeric: tabular-nums; }
    .label {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--text-muted);
    }
    .container { max-width: 1320px; margin: 0 auto; padding: 0 20px; }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      display: inline-block; flex-shrink: 0;
      background: var(--yes);
    }
    .dot.brand { background: var(--brand); }
    .dot.warn { background: var(--warn); }
    .dot.no { background: var(--no); }
    .base-square {
      width: 18px; height: 18px; background: var(--brand);
      display: inline-block; flex-shrink: 0;
    }
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 3px 9px; border: 1px solid var(--border);
      background: var(--surface-2);
      font-family: var(--font-mono); font-size: 10px; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted);
      white-space: nowrap;
    }
    .badge.brand { background: var(--brand-tint); border-color: var(--brand-border); color: var(--brand); }
    .badge.yes { background: var(--yes-bg); border-color: var(--yes-border); color: var(--yes); }
    .badge.no { background: var(--no-bg); border-color: var(--no-border); color: var(--no); }
    .badge.warn { background: var(--warn-bg); border-color: var(--warn); color: var(--warn); }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 40px; padding: 0 16px;
      border: 1px solid var(--border-strong); background: var(--surface);
      color: var(--text); font-size: 13px; font-weight: 600;
      cursor: pointer; transition: background 120ms var(--ease), border-color 120ms var(--ease), color 120ms var(--ease);
      white-space: nowrap;
    }
    .btn:hover:not(:disabled) { background: var(--surface-hover); border-color: var(--brand); }
    .btn:active:not(:disabled) { opacity: 0.86; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary { background: var(--brand); border-color: var(--brand); color: var(--brand-fg); }
    .btn-primary:hover:not(:disabled) { background: var(--brand-hover); border-color: var(--brand-hover); color: var(--brand-fg); }
    .btn-sm { min-height: 32px; padding: 0 11px; font-size: 11px; }
    .btn-pill { border-radius: 999px; }
    .btn-yes { background: var(--yes-bg); border-color: var(--yes-border); color: var(--yes); }
    .btn-yes:hover:not(:disabled) { background: var(--yes); color: #ffffff; border-color: var(--yes); }
    .btn-no { background: var(--no-bg); border-color: var(--no-border); color: var(--no); }
    .btn-no:hover:not(:disabled) { background: var(--no); color: #ffffff; border-color: var(--no); }
    .input {
      width: 100%; min-height: 42px; padding: 8px 12px;
      background: var(--bg); border: 1px solid var(--border-strong);
      color: var(--text); font-size: 13px;
      transition: border-color 120ms var(--ease);
    }
    .input:focus { outline: none; border-color: var(--brand); }
    .tabs { display: inline-flex; border: 1px solid var(--border); background: var(--surface-2); }
    .tab {
      background: transparent; border: none; border-right: 1px solid var(--border);
      padding: 7px 13px; font-family: var(--font-mono); font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted);
      cursor: pointer; transition: background 120ms var(--ease), color 120ms var(--ease);
    }
    .tab:last-child { border-right: none; }
    .tab:hover { color: var(--text); background: var(--surface-hover); }
    .tab.active { background: var(--brand); color: var(--brand-fg); }
    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(16px);
      background: var(--text); color: var(--bg);
      padding: 10px 18px; border: 1px solid var(--brand);
      font-family: var(--font-mono); font-size: 11px; font-weight: 700;
      letter-spacing: 0.04em; z-index: 400; opacity: 0; pointer-events: none;
      transition: opacity 140ms var(--ease), transform 140ms var(--ease);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .nav { border-bottom: 1px solid var(--border); padding: 12px 0; background: var(--bg); }
    .nav-inner { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .profile-top {
      display: grid; grid-template-columns: 1.4fr 0.6fr;
      border-left: 1px solid var(--border); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
      background: var(--border); gap: 1px;
    }
    .panel { background: var(--surface); padding: 26px; }
    .kpi-4 {
      display: grid; grid-template-columns: repeat(4, 1fr);
      border-left: 1px solid var(--border); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
      background: var(--border); gap: 1px;
    }
    .list-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 11px 0; border-bottom: 1px solid var(--border); font-size: 13px;
    }
    .list-row:last-child { border-bottom: none; }
    @media (max-width: 820px) {
      .profile-top { grid-template-columns: 1fr; }
      .kpi-4 { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div class="toast" id="toast">Copied</div>
  <header class="nav">
    <div class="container nav-inner">
      <a href="/" style="display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-0.03em;">
        <span class="base-square"></span><span>TIPPY</span><span class="badge brand">IDENTITY</span>
      </a>
      <div style="display:flex;gap:8px;align-items:center;">
        <button type="button" class="btn btn-sm mono" id="langBtn">RU</button>
        <button type="button" class="btn btn-sm mono" id="themeBtn">DARK</button>
        <a href="/" class="btn btn-sm" data-en="Dashboard" data-ru="Терминал">Dashboard</a>
        <a href="/app" class="btn btn-primary btn-sm">Mini App</a>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="profile-top">
      <div class="panel" style="display:flex;flex-direction:column;justify-content:space-between;gap:18px;">
        <div>
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
            <span class="label" data-en="BASE L2 PROFILE &amp; BASENAME" data-ru="ПРОФИЛЬ BASE L2 И BASENAME">BASE L2 PROFILE &amp; BASENAME</span>
            <span class="badge" id="uRole">PUBLIC VIEW</span>
          </div>
          <h1 style="font-size:clamp(26px, 3.6vw, 40px);font-weight:800;letter-spacing:-0.04em;margin-top:8px;" id="uName">@loading</h1>
        </div>
        <div style="display:flex;gap:28px;flex-wrap:wrap;padding-top:14px;border-top:1px solid var(--border);">
          <div>
            <div class="label" data-en="LIVE BALANCE" data-ru="БАЛАНС USDC">LIVE BALANCE</div>
            <div class="mono" style="font-size:26px;font-weight:800;margin-top:4px;" id="uBal">Private</div>
          </div>
          <div>
            <div class="label" data-en="DEPOSIT ADDRESS (BASE)" data-ru="АДРЕС ДЕПОЗИТА (BASE)">DEPOSIT ADDRESS (BASE)</div>
            <div style="display:flex;align-items:center;gap:8px;margin-top:8px;">
              <span class="mono" style="font-size:13px;" id="uDepAddr">—</span>
              <button type="button" class="btn btn-sm mono" id="copyAddrBtn">COPY</button>
            </div>
          </div>
        </div>
      </div>

      <div class="panel" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;">
        <span class="label" data-en="SCAN TO DEPOSIT / DONATE" data-ru="QR ДЛЯ ДЕПОЗИТА / ДОНАТА">SCAN TO DEPOSIT / DONATE</span>
        <div style="width:152px;height:152px;background:#ffffff;border:1px solid var(--border-strong);display:flex;align-items:center;justify-content:center;padding:6px;">
          <img id="uQrImg" alt="Deposit QR" style="width:140px;height:140px;display:none;">
          <svg id="uQrSvg" viewBox="0 0 21 21" width="136" height="136" shape-rendering="crispEdges"></svg>
        </div>
        <button type="button" class="btn btn-primary btn-sm" id="copyTipBtn" data-en="Copy /tip Command" data-ru="Копировать /tip">Copy /tip Command</button>
      </div>
    </section>

    <section class="kpi-4">
      <div class="panel" style="padding:18px 20px;"><div class="label" data-en="TIPS SENT" data-ru="ОТПРАВЛЕНО ЧАЕВЫХ">TIPS SENT</div><div class="mono" style="font-size:22px;font-weight:800;margin-top:4px;" id="uSent">$0.00</div></div>
      <div class="panel" style="padding:18px 20px;"><div class="label" data-en="TIPS RECEIVED" data-ru="ПОЛУЧЕНО ЧАЕВЫХ">TIPS RECEIVED</div><div class="mono" style="font-size:22px;font-weight:800;margin-top:4px;" id="uRecv">$0.00</div></div>
      <div class="panel" style="padding:18px 20px;"><div class="label" data-en="MARKET STAKES" data-ru="СТАВКИ НА РЫНКАХ">MARKET STAKES</div><div class="mono" style="font-size:22px;font-weight:800;margin-top:4px;" id="uPlaced">$0.00</div></div>
      <div class="panel" style="padding:18px 20px;"><div class="label" data-en="WINNINGS &amp; CREATOR FEES" data-ru="ВЫИГРЫШИ И КОМИССИИ">WINNINGS &amp; CREATOR FEES</div><div class="mono" style="font-size:22px;font-weight:800;margin-top:4px;color:var(--yes);" id="uWon">$0.00</div></div>
    </section>

    <section id="ownerBox" style="display:none;border-left:1px solid var(--border);border-right:1px solid var(--border);border-bottom:1px solid var(--border);">
      <div class="panel">
        <div class="label" style="margin-bottom:10px;" data-en="RECENT LEDGER TRANSACTIONS (OWNER SESSION)" data-ru="ПОСЛЕДНИЕ ТРАНЗАКЦИИ (СЕССИЯ ВЛАДЕЛЬЦА)">RECENT LEDGER TRANSACTIONS (OWNER SESSION)</div>
        <div id="uHist"></div>
      </div>
    </section>
  </main>

  <script>
    (function () {
      let lang = 'en';
      let depAddr = '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913';
      let displayHandle = '@ssrjkk';
      const parts = window.location.pathname.split('/').filter(Boolean);
      const tgId = parts[0] === 'u' ? parts[1] : (new URLSearchParams(window.location.search).get('id') || '1');
      const fmt = (n) => '$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const esc = (s) => String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const toast = (m) => { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1800); };

      document.getElementById('themeBtn').addEventListener('click', function () {
        const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        this.textContent = next === 'dark' ? 'LIGHT' : 'DARK';
      });
      document.getElementById('langBtn').addEventListener('click', function () {
        lang = lang === 'en' ? 'ru' : 'en';
        this.textContent = lang === 'en' ? 'RU' : 'EN';
        document.querySelectorAll('[data-en]').forEach((el) => { const v = el.getAttribute('data-' + lang); if (v) el.textContent = v; });
      });
      document.getElementById('copyAddrBtn').addEventListener('click', () => { navigator.clipboard?.writeText(depAddr); toast('Copied address'); });
      document.getElementById('copyTipBtn').addEventListener('click', () => {
        const cmd = '/tip 5 ' + displayHandle;
        navigator.clipboard?.writeText(cmd);
        toast('Copied: ' + cmd);
      });

      function renderFallbackQr(seed) {
        const svg = document.getElementById('uQrSvg');
        let h = 2166136261;
        for (let i = 0; i < seed.length; i++) { h ^= seed.charCodeAt(i); h = Math.imul(h, 16777619); }
        let r = '';
        for (let y = 0; y < 21; y++) for (let x = 0; x < 21; x++) {
          h = Math.imul(h ^ (x * 31 + y * 17), 16777619);
          if ((h >>> 0) % 2 === 0) r += '<rect x="' + x + '" y="' + y + '" width="1" height="1" fill="#111111"/>';
        }
        svg.innerHTML = r;
      }

      async function load() {
        renderFallbackQr(depAddr);
        try {
          const r = await fetch('/api/user/' + tgId);
          if (!r.ok) throw 0;
          const u = await r.json();
          displayHandle = u.username ? (u.username.includes('.') ? u.username : '@' + u.username.replace(/^@/, '')) : ('#' + tgId);
          document.getElementById('uName').textContent = displayHandle;
          depAddr = u.deposit_address || depAddr;
          document.getElementById('uDepAddr').textContent = depAddr.slice(0, 8) + '…' + depAddr.slice(-6);
          const img = document.getElementById('uQrImg');
          img.addEventListener('load', () => { img.style.display = 'block'; document.getElementById('uQrSvg').style.display = 'none'; });
          img.src = '/qr?size=180&data=' + encodeURIComponent(depAddr);
          document.getElementById('uSent').textContent = fmt(u.tips_sent_usdc);
          document.getElementById('uRecv').textContent = fmt(u.tips_received_usdc);
          document.getElementById('uPlaced').textContent = fmt(u.bets_placed_usdc);
          document.getElementById('uWon').textContent = fmt((u.bets_won_usdc || 0) + (u.creator_fees_usdc || 0));
          if (u.is_owner) {
            document.getElementById('uRole').textContent = 'AUTHENTICATED OWNER';
            document.getElementById('uRole').className = 'badge yes';
            document.getElementById('uBal').textContent = fmt(u.balance_usdc) + ' USDC';
            document.getElementById('ownerBox').style.display = 'block';
            document.getElementById('uHist').innerHTML = (u.history || []).map((h) => (
              '<div class="list-row"><span class="badge brand">' + esc(String(h.kind).toUpperCase()) + '</span><strong class="mono">' + fmt(h.amount_usdc) + '</strong></div>'
            )).join('') || '<div class="list-row">No transactions yet</div>';
          }
        } catch (_) {
          document.getElementById('uName').textContent = 'ssrjkk.base.eth (Preview)';
          document.getElementById('uDepAddr').textContent = depAddr.slice(0, 8) + '…' + depAddr.slice(-6);
        }
      }
      load();
    })();
  </script>
</body>
</html>
