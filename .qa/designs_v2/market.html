<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Market Terminal — Tippy on Base</title>
  <style>

    :root {
      --bg: #ffffff;
      --bg-subtle: #f7f7f8;
      --surface: #ffffff;
      --surface-2: #f2f2f4;
      --surface-hover: #eaecef;
      --border: #e4e4e7;
      --border-strong: #c8c8ce;
      --text: #111111;
      --text-muted: #52525b;
      --text-dim: #71717a;
      --brand: #0000ff;
      --brand-hover: #0000cc;
      --brand-fg: #ffffff;
      --brand-tint: rgba(0, 0, 255, 0.07);
      --brand-border: rgba(0, 0, 255, 0.35);
      --yes: #047857;
      --yes-bg: rgba(4, 120, 87, 0.09);
      --yes-border: rgba(4, 120, 87, 0.35);
      --no: #be123c;
      --no-bg: rgba(190, 18, 60, 0.09);
      --no-border: rgba(190, 18, 60, 0.35);
      --warn: #b45309;
      --warn-bg: rgba(180, 83, 9, 0.10);
      --font-sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
      --ease: cubic-bezier(0.2, 0, 0, 1);
    }
    [data-theme="dark"] {
      --bg: #111111;
      --bg-subtle: #161618;
      --surface: #111111;
      --surface-2: #1a1a1e;
      --surface-hover: #222228;
      --border: #26262c;
      --border-strong: #3c3c46;
      --text: #ffffff;
      --text-muted: #a1a1aa;
      --text-dim: #71717a;
      --brand: #224bff;
      --brand-hover: #4266ff;
      --brand-fg: #ffffff;
      --brand-tint: rgba(34, 75, 255, 0.14);
      --brand-border: rgba(34, 75, 255, 0.50);
      --yes: #34d399;
      --yes-bg: rgba(52, 211, 153, 0.12);
      --yes-border: rgba(52, 211, 153, 0.38);
      --no: #fb7185;
      --no-bg: rgba(251, 113, 133, 0.12);
      --no-border: rgba(251, 113, 133, 0.38);
      --warn: #fbbf24;
      --warn-bg: rgba(251, 191, 36, 0.14);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }
    button, input, select { font-family: inherit; color: inherit; }
    .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
    .num { font-variant-numeric: tabular-nums; }
    .label {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--text-muted);
    }
    .container { max-width: 1320px; margin: 0 auto; padding: 0 20px; }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      display: inline-block; flex-shrink: 0;
      background: var(--yes);
    }
    .dot.brand { background: var(--brand); }
    .dot.warn { background: var(--warn); }
    .dot.no { background: var(--no); }
    .base-square {
      width: 18px; height: 18px; background: var(--brand);
      display: inline-block; flex-shrink: 0;
    }
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 3px 9px; border: 1px solid var(--border);
      background: var(--surface-2);
      font-family: var(--font-mono); font-size: 10px; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted);
      white-space: nowrap;
    }
    .badge.brand { background: var(--brand-tint); border-color: var(--brand-border); color: var(--brand); }
    .badge.yes { background: var(--yes-bg); border-color: var(--yes-border); color: var(--yes); }
    .badge.no { background: var(--no-bg); border-color: var(--no-border); color: var(--no); }
    .badge.warn { background: var(--warn-bg); border-color: var(--warn); color: var(--warn); }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 40px; padding: 0 16px;
      border: 1px solid var(--border-strong); background: var(--surface);
      color: var(--text); font-size: 13px; font-weight: 600;
      cursor: pointer; transition: background 120ms var(--ease), border-color 120ms var(--ease), color 120ms var(--ease);
      white-space: nowrap;
    }
    .btn:hover:not(:disabled) { background: var(--surface-hover); border-color: var(--brand); }
    .btn:active:not(:disabled) { opacity: 0.86; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary { background: var(--brand); border-color: var(--brand); color: var(--brand-fg); }
    .btn-primary:hover:not(:disabled) { background: var(--brand-hover); border-color: var(--brand-hover); color: var(--brand-fg); }
    .btn-sm { min-height: 32px; padding: 0 11px; font-size: 11px; }
    .btn-pill { border-radius: 999px; }
    .btn-yes { background: var(--yes-bg); border-color: var(--yes-border); color: var(--yes); }
    .btn-yes:hover:not(:disabled) { background: var(--yes); color: #ffffff; border-color: var(--yes); }
    .btn-no { background: var(--no-bg); border-color: var(--no-border); color: var(--no); }
    .btn-no:hover:not(:disabled) { background: var(--no); color: #ffffff; border-color: var(--no); }
    .input {
      width: 100%; min-height: 42px; padding: 8px 12px;
      background: var(--bg); border: 1px solid var(--border-strong);
      color: var(--text); font-size: 13px;
      transition: border-color 120ms var(--ease);
    }
    .input:focus { outline: none; border-color: var(--brand); }
    .tabs { display: inline-flex; border: 1px solid var(--border); background: var(--surface-2); }
    .tab {
      background: transparent; border: none; border-right: 1px solid var(--border);
      padding: 7px 13px; font-family: var(--font-mono); font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted);
      cursor: pointer; transition: background 120ms var(--ease), color 120ms var(--ease);
    }
    .tab:last-child { border-right: none; }
    .tab:hover { color: var(--text); background: var(--surface-hover); }
    .tab.active { background: var(--brand); color: var(--brand-fg); }
    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(16px);
      background: var(--text); color: var(--bg);
      padding: 10px 18px; border: 1px solid var(--brand);
      font-family: var(--font-mono); font-size: 11px; font-weight: 700;
      letter-spacing: 0.04em; z-index: 400; opacity: 0; pointer-events: none;
      transition: opacity 140ms var(--ease), transform 140ms var(--ease);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .nav { border-bottom: 1px solid var(--border); padding: 12px 0; background: var(--bg); }
    .nav-inner { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .term-grid {
      display: grid; grid-template-columns: 1.35fr 0.85fr;
      border-left: 1px solid var(--border); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
      background: var(--border); gap: 1px;
    }
    .panel { background: var(--surface); padding: 28px; }
    .out-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 13px 16px; border: 1px solid var(--border); background: var(--bg);
      margin-bottom: 8px; cursor: pointer; font-weight: 700;
      transition: border-color 120ms var(--ease), background 120ms var(--ease);
    }
    .out-row:hover { border-color: var(--brand); background: var(--bg-subtle); }
    .out-row.active { border-color: var(--brand); background: var(--brand-tint); }
    @media (max-width: 860px) { .term-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="toast" id="toast">Copied</div>
  <header class="nav">
    <div class="container nav-inner">
      <a href="/" style="display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-0.03em;">
        <span class="base-square"></span><span>TIPPY</span><span class="badge brand">MARKET</span>
      </a>
      <div style="display:flex;gap:8px;align-items:center;">
        <button type="button" class="btn btn-sm mono" id="langBtn">RU</button>
        <button type="button" class="btn btn-sm mono" id="themeBtn">DARK</button>
        <a href="/" class="btn btn-sm" data-en="← All Markets" data-ru="← Все рынки">← All Markets</a>
        <a href="/app" class="btn btn-primary btn-sm">Mini App</a>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="term-grid">
      <div class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px;">
          <span class="badge brand" id="mTypeBadge">LMSR AMM</span>
          <span class="label" id="mPoolLbl">POOL: $—</span>
        </div>
        <h1 style="font-size:clamp(22px, 3vw, 32px);font-weight:800;letter-spacing:-0.035em;line-height:1.12;margin-bottom:18px;" id="mTitle">Loading market...</h1>
        <div style="display:flex;height:7px;background:var(--surface-2);margin-bottom:20px;"><div id="mBar" style="width:50%;background:var(--brand);transition:width 180ms var(--ease);"></div></div>
        <div class="label" style="margin-bottom:10px;" data-en="OUTCOME SHARES (CLICK TO SIMULATE)" data-ru="ИСХОДЫ РЫНКА (НАЖМИТЕ ДЛЯ РАСЧЕТА)">OUTCOME SHARES (CLICK TO SIMULATE)</div>
        <div id="mOutcomes"></div>
      </div>

      <div class="panel" style="display:flex;flex-direction:column;justify-content:space-between;gap:18px;">
        <div>
          <div class="label" style="margin-bottom:8px;" data-en="HANSON LMSR PAYOUT SIMULATOR" data-ru="КАЛЬКУЛЯТОР ВЫПЛАТЫ LMSR">HANSON LMSR PAYOUT SIMULATOR</div>
          <div style="border:1px solid var(--border);background:var(--bg-subtle);padding:10px;margin-bottom:12px;">
            <div style="display:flex;justify-content:space-between;margin-bottom:4px;">
              <span class="label">PRICE IMPACT</span>
              <span class="mono" style="font-size:11px;font-weight:700;color:var(--brand);" id="mShift">—</span>
            </div>
            <svg viewBox="0 0 360 76" style="width:100%;height:76px;display:block;">
              <line x1="0" y1="38" x2="360" y2="38" stroke="var(--border-strong)" stroke-dasharray="3 3"/>
              <path d="M0,66 C110,58 240,22 360,10" fill="none" stroke="var(--brand)" stroke-width="2"/>
              <circle id="dotB" cx="180" cy="38" r="4" fill="var(--text-muted)"/>
              <circle id="dotA" cx="215" cy="30" r="5" fill="var(--brand)"/>
            </svg>
          </div>
          <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px;" id="amtChips">
            <button type="button" class="btn btn-sm mono" data-a="10">$10</button>
            <button type="button" class="btn btn-sm btn-primary mono" data-a="25">$25</button>
            <button type="button" class="btn btn-sm mono" data-a="50">$50</button>
            <button type="button" class="btn btn-sm mono" data-a="100">$100</button>
          </div>
          <input type="number" id="stakeInput" class="input mono" value="25" min="1" max="1000">
          <div class="mono" style="margin-top:12px;padding:12px;border:1px solid var(--border);background:var(--surface-2);font-size:12px;display:flex;flex-direction:column;gap:6px;">
            <div style="display:flex;justify-content:space-between;"><span style="color:var(--text-muted);">Outcome Shares</span><strong id="outShares">—</strong></div>
            <div style="display:flex;justify-content:space-between;"><span style="color:var(--text-muted);">Est. Payout</span><strong style="color:var(--yes);" id="outPay">—</strong></div>
            <div style="display:flex;justify-content:space-between;padding-top:6px;border-top:1px solid var(--border);"><span style="color:var(--brand);" id="cmdStr">/trade ...</span><button type="button" class="badge brand" id="copyCmd" style="cursor:pointer;">COPY</button></div>
          </div>
        </div>
        <a href="https://t.me/tippy_on_base_bot" target="_blank" class="btn btn-primary" style="width:100%;" data-en="Execute Trade in Telegram ↗" data-ru="Исполнить сделку в Telegram ↗">Execute Trade in Telegram ↗</a>
      </div>
    </div>
  </main>

  <script>
    (function () {
      let lang = 'en', activeIdx = 0, marketData = null, isAmm = true;
      const parts = window.location.pathname.split('/').filter(Boolean);
      const id = parts[parts.length - 1] || '14';
      const fmt = (n) => '$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const esc = (s) => String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const toast = (m) => { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1800); };

      document.getElementById('themeBtn').addEventListener('click', function () {
        const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        this.textContent = next === 'dark' ? 'LIGHT' : 'DARK';
      });
      document.getElementById('langBtn').addEventListener('click', function () {
        lang = lang === 'en' ? 'ru' : 'en';
        this.textContent = lang === 'en' ? 'RU' : 'EN';
        document.querySelectorAll('[data-en]').forEach((el) => { const v = el.getAttribute('data-' + lang); if (v) el.textContent = v; });
      });

      function updateCalc() {
        if (!marketData) return;
        const opt = (marketData.options || [])[activeIdx];
        const p0 = opt ? (opt.price_pct ?? opt.prob_pct ?? (marketData.pot ? (opt.pool / marketData.pot) * 100 : 50)) : 50;
        const spend = Math.max(parseFloat(document.getElementById('stakeInput').value) || 0, 1);
        const liq = marketData.liquidity_usdc ?? marketData.pot_usdc ?? 500;
        const b = Math.max(liq / Math.LN2, 60);
        const pc = Math.min(Math.max(p0 / 100, 0.02), 0.98);
        const q1 = b * Math.log(pc / (1 - pc)), q2 = 0;
        const cost = (a, c) => { const m = Math.max(a, c); return b * (Math.log(Math.exp((a - m) / b) + Math.exp((c - m) / b)) + m / b); };
        const bc = cost(q1, q2);
        let lo = 0, hi = spend * 40;
        for (let i = 0; i < 36; i++) { const mid = (lo + hi) / 2; if (cost(q1 + mid, q2) - bc <= spend) lo = mid; else hi = mid; }
        const mNew = Math.max(q1 + lo, q2);
        const pAfter = (Math.exp((q1 + lo - mNew) / b) / (Math.exp((q1 + lo - mNew) / b) + Math.exp((q2 - mNew) / b))) * 100;
        const roi = Math.round(((lo - spend) / spend) * 100);
        document.getElementById('mShift').textContent = p0.toFixed(1) + '% → ' + pAfter.toFixed(1) + '%';
        document.getElementById('outShares').textContent = lo.toFixed(2) + ' shares';
        document.getElementById('outPay').textContent = fmt(lo) + ' (+' + roi + '% ROI)';
        document.getElementById('dotB').setAttribute('cx', (15 + (p0 / 100) * 330).toFixed(1));
        document.getElementById('dotB').setAttribute('cy', (68 - (p0 / 100) * 58).toFixed(1));
        document.getElementById('dotA').setAttribute('cx', (15 + (pAfter / 100) * 330).toFixed(1));
        document.getElementById('dotA').setAttribute('cy', (68 - (pAfter / 100) * 58).toFixed(1));
        document.getElementById('cmdStr').textContent = (isAmm ? '/trade ' : '/bet ') + marketData.id + ' ' + (activeIdx + 1) + ' ' + spend;
      }

      document.getElementById('stakeInput').addEventListener('input', updateCalc);
      document.querySelectorAll('#amtChips [data-a]').forEach((b) => {
        b.addEventListener('click', () => {
          document.querySelectorAll('#amtChips [data-a]').forEach((x) => x.classList.remove('btn-primary'));
          b.classList.add('btn-primary');
          document.getElementById('stakeInput').value = b.getAttribute('data-a');
          updateCalc();
        });
      });
      document.getElementById('copyCmd').addEventListener('click', () => {
        const c = document.getElementById('cmdStr').textContent;
        navigator.clipboard?.writeText(c);
        toast('Copied: ' + c);
      });

      async function load() {
        try { const r = await fetch('/api/prediction/' + id); if (r.ok) marketData = await r.json(); } catch (_) {}
        if (!marketData) {
          isAmm = false;
          try { const r2 = await fetch('/api/market/' + id); if (r2.ok) marketData = await r2.json(); } catch (_) {}
        }
        if (!marketData) {
          isAmm = true;
          marketData = { id, question: 'Market #' + id + ' (Preview / Not Found)', liquidity_usdc: 1000, options: [{ label: 'YES', price_pct: 60 }, { label: 'NO', price_pct: 40 }] };
        }
        document.getElementById('mTypeBadge').textContent = (isAmm ? 'LMSR AMM #' : 'PARIMUTUEL #') + marketData.id;
        document.getElementById('mPoolLbl').textContent = 'POOL: ' + fmt(marketData.liquidity_usdc ?? marketData.pot_usdc);
        document.getElementById('mTitle').textContent = marketData.question || marketData.title;
        const opts = marketData.options || [];
        const p0 = opts[0] ? (opts[0].price_pct ?? opts[0].prob_pct ?? (marketData.pot ? (opts[0].pool / marketData.pot) * 100 : 50)) : 50;
        document.getElementById('mBar').style.width = Math.min(Math.max(p0, 4), 96) + '%';
        document.getElementById('mOutcomes').innerHTML = opts.map((o, i) => {
          const pct = o.price_pct ?? o.prob_pct ?? (marketData.pot ? (o.pool / marketData.pot) * 100 : 50);
          return '<div class="out-row ' + (i === 0 ? 'active' : '') + '" data-oi="' + i + '"><span><strong>#' + (i + 1) + '</strong> ' + esc(o.label || o.text) + '</span><span class="mono" style="color:var(--brand);">' + Number(pct).toFixed(1) + '%</span></div>';
        }).join('');
        document.querySelectorAll('#mOutcomes .out-row').forEach((row) => {
          row.addEventListener('click', () => {
            activeIdx = Number(row.getAttribute('data-oi'));
            document.querySelectorAll('#mOutcomes .out-row').forEach((x) => x.classList.remove('active'));
            row.classList.add('active');
            updateCalc();
          });
        });
        updateCalc();
      }
      load();
    })();
  </script>
</body>
</html>
