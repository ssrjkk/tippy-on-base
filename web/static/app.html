<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
/* Theme and the Telegram handshake have to land before first paint: without
   telegram-web-app.js there is no WebApp.initData, so /api/mini/auth never runs
   and the app opens anonymous inside Telegram. */
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }
  var saved = localStorage.getItem('theme');
  var dark;
  if (saved) dark = saved === 'dark';
  else if (tg && tg.colorScheme) dark = tg.colorScheme === 'dark';
  else dark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  if (dark) document.documentElement.setAttribute('data-theme', 'dark');
  /* Language before first paint too. The saved setting arrives with /state, but
     the shell renders first, and rendering it in English for a Russian-speaking
     user is a visible flash of the wrong language. A choice made in the app
     wins over the client language. */
  var lc = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code) || '';
  var seed = localStorage.getItem('lang') || (/^zh/i.test(lc) ? 'zh' : /^ru/i.test(lc) ? 'ru' : 'en');
  window.__seedLang = seed;
  document.documentElement.lang = seed;
})();
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Golos+Text:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
/* Tokens copied from /style.css — base.org values: one brand blue, neutral greys,
 * hairline borders, no shadows. --accent paints surfaces, --accent-text paints type,
 * because #224bff is a fill colour and is not readable as text on the dark canvas. */
:root,[data-theme="light"]{--accent:#0000ff;--accent2:#0000cc;--accent-text:#0000ff;--blue-soft:rgba(0,0,255,.07);--blue-line:rgba(0,0,255,.22);--bg:#ffffff;--card:#ffffff;--card2:#f8f8f8;--card3:#efefef;--border:#efefef;--border-strong:#dadada;--text:#111111;--text2:#3a3a3a;--text3:#6f6f6f;--text4:#767676;--success:#10693f;--success-bg:rgba(16,105,63,.08);--danger:#b42318;--danger-bg:rgba(180,35,24,.07);--warning:#8a5a00;--nav-bg:rgba(255,255,255,.92);--scrim:rgba(17,17,17,.45);--radius:8px;--radius-lg:12px;--pill:9999px;--font-ui:"Schibsted Grotesk","Golos Text","Helvetica Neue",Helvetica,Arial,sans-serif;--font-mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;--ease:cubic-bezier(.2,.6,.2,1);--safe-b:env(safe-area-inset-bottom,0px)}
[data-theme="dark"]{--accent:#224bff;--accent2:#3d61ff;--accent-text:#7575ff;--blue-soft:rgba(34,75,255,.16);--blue-line:rgba(117,117,255,.32);--bg:#111111;--card:#1a1a1a;--card2:#1a1a1a;--card3:#262626;--border:#2d2d2d;--border-strong:#3a3a3a;--text:#ededed;--text2:#c8c8c8;--text3:#9a9a9a;--text4:#9a9a9a;--success:#4bd09b;--success-bg:rgba(75,208,155,.14);--danger:#ff7a70;--danger-bg:rgba(255,122,112,.12);--warning:#d99a2b;--nav-bg:rgba(17,17,17,.92);--scrim:rgba(0,0,0,.65)}
html,body{height:100%;font-family:var(--font-ui);font-size:15px;line-height:1.5;background:var(--bg);color:var(--text);overflow:hidden;-webkit-tap-highlight-color:transparent}
a{color:var(--accent-text);text-decoration:none}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit;outline:none}
input,textarea{font-family:inherit;outline:none;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:var(--blue-line)}
::-webkit-scrollbar{width:0;height:0}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.icon{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

#app{max-width:480px;margin:0 auto;height:100%;position:relative;display:flex;flex-direction:column;overflow:hidden}

/* Header */
.header{position:sticky;top:0;z-index:100;background:var(--nav-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);min-height:54px}
.header-logo{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:600;letter-spacing:-.02em}
.header-logo .base-mark{width:22px;height:22px;border-radius:6px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.header-logo .base-mark svg{width:14px;height:14px}
.header-logo .dot{color:var(--accent-text)}
.header-right{display:flex;align-items:center;gap:8px}
.theme-toggle{width:34px;height:34px;border-radius:var(--pill);border:1px solid var(--border-strong);display:flex;align-items:center;justify-content:center;color:var(--text3);transition:color .2s var(--ease),border-color .2s var(--ease)}
.theme-toggle:hover,.theme-toggle:active{border-color:var(--text);color:var(--text)}
[data-theme="dark"] .theme-toggle .icon-sun{display:inline}
[data-theme="dark"] .theme-toggle .icon-moon{display:none}
.theme-toggle .icon-sun{display:none}
.theme-toggle .icon-moon{display:inline}
.balance-chip{border:1px solid var(--border-strong);border-radius:var(--pill);padding:6px 12px;font-size:13px;font-weight:500;font-family:var(--font-mono);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:7px;transition:border-color .2s var(--ease)}
.balance-chip:hover{border-color:var(--text)}
.balance-chip .dot{width:6px;height:6px;border-radius:50%;background:var(--success);flex-shrink:0}

/* Content */
.content{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:calc(72px + var(--safe-b));-webkit-overflow-scrolling:touch;scrollbar-width:none}
.content::-webkit-scrollbar{display:none}
.tab-page{display:none;padding:16px;animation:fadeUp .25s var(--ease)}
.tab-page.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Tab Bar */
.tab-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--nav-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--border);display:flex;z-index:100;padding-bottom:var(--safe-b)}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 8px;font-size:11px;color:var(--text4);transition:color .2s var(--ease);position:relative}
.tab-item.active{color:var(--accent-text)}
.tab-item .icon{width:20px;height:20px}
.tab-item::after{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:20px;height:2px;border-radius:var(--pill);background:var(--accent-text);opacity:0;transition:opacity .2s var(--ease)}
.tab-item.active::after{opacity:1}

/* Cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:10px}
.card-header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.card-title{font-size:11px;color:var(--text3);font-weight:500;text-transform:uppercase;letter-spacing:.08em}
.big-number{font-size:30px;font-weight:500;letter-spacing:-.03em;line-height:1.1;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.big-number .currency{font-size:14px;color:var(--text3);font-weight:500;margin-left:6px;letter-spacing:0}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:var(--pill);font-weight:500;font-size:14px;padding:12px 20px;border:1px solid transparent;transition:background-color .2s var(--ease),border-color .2s var(--ease),opacity .2s var(--ease);white-space:nowrap}
.btn:active{opacity:.8}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover,.btn-primary:active{background:var(--accent2)}
.btn-secondary{background:transparent;color:var(--text);border-color:var(--border-strong)}
.btn-secondary:hover{border-color:var(--text);background:var(--card2)}
.btn-sm{padding:9px 14px;font-size:13px}
.btn-full{width:100%}
.btn .icon{width:15px;height:15px}

/* Action Row */
.action-row{display:flex;gap:8px;margin:14px 0}
.action-btn{flex:1;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;font-weight:500;color:var(--text);transition:border-color .2s var(--ease),background-color .2s var(--ease)}
.action-btn:hover,.action-btn:active{border-color:var(--accent-text)}
.action-btn .icon{width:20px;height:20px;color:var(--accent-text)}

/* Amount Chips */
.chips{display:flex;gap:8px;margin:8px 0}
.chip{background:var(--card2);border:1px solid var(--border);border-radius:var(--pill);padding:8px 16px;font-size:13px;font-weight:500;font-family:var(--font-mono);color:var(--text);cursor:pointer;transition:border-color .2s var(--ease),background-color .2s var(--ease),color .2s var(--ease);min-width:48px;text-align:center}
.chip:active,.chip.active{border-color:var(--accent);background:var(--blue-soft);color:var(--accent-text)}
.chip-btn{border:1px solid var(--border-strong);border-radius:var(--pill);padding:5px 12px;font-size:12px;font-weight:500;color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:border-color .2s var(--ease)}
.chip-btn:hover,.chip-btn:active{border-color:var(--text)}
.chip-btn .icon{width:13px;height:13px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* Input */
.input{width:100%;background:var(--card2);border:1px solid var(--border-strong);border-radius:var(--radius);padding:11px 14px;font-size:14px;color:var(--text);transition:border-color .2s var(--ease),box-shadow .2s var(--ease)}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--blue-soft)}
.input::placeholder{color:var(--text4)}
.input-group{margin-bottom:12px}
.input-label{font-size:12px;color:var(--text3);margin-bottom:6px;display:block;font-weight:500}
.hint{font-size:12px;color:var(--text3);line-height:1.5}

/* Market / Bet Card */
.market-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;cursor:pointer;transition:border-color .2s var(--ease),background-color .2s var(--ease);display:block;width:100%;text-align:left}
.market-card:hover,.market-card:active{border-color:var(--border-strong);background:var(--card2)}
.market-question{font-size:15px;font-weight:500;margin-bottom:10px;line-height:1.4;letter-spacing:-.01em}
.market-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;color:var(--text3);font-family:var(--font-mono);letter-spacing:.03em;margin-top:8px}
.prob-bars{display:flex;flex-direction:column;gap:8px}
.prob-bar{height:4px;border-radius:var(--pill);background:var(--card3);overflow:hidden}
.prob-bar-fill{height:100%;border-radius:var(--pill);background:var(--accent);transition:width .4s var(--ease)}
.prob-bar-label{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;color:var(--text2);margin-bottom:5px}
.prob-bar-label .num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.prob-bar-label .win{color:var(--accent-text);font-weight:600}

/* Status chips */
.tag{display:inline-flex;align-items:center;border-radius:var(--pill);padding:2px 8px;font-size:10px;font-weight:500;font-family:var(--font-mono);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.tag-open{background:var(--blue-soft);color:var(--accent-text)}
.tag-resolved{background:var(--success-bg);color:var(--success)}
.tag-cancelled{background:var(--card3);color:var(--text3)}

/* Transaction History */
.tx-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}
.tx-item:last-child{border-bottom:none}
.tx-icon{width:30px;height:30px;border-radius:var(--pill);border:1px solid var(--border);background:var(--card2);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text3)}
.tx-icon .icon{width:14px;height:14px}
.tx-icon.in{background:var(--success-bg);border-color:transparent;color:var(--success)}
.tx-icon.out{background:var(--danger-bg);border-color:transparent;color:var(--danger)}
.tx-details{flex:1;min-width:0}
.tx-title{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-time{font-size:11px;color:var(--text3);font-family:var(--font-mono)}
.tx-amount{font-size:14px;font-weight:500;white-space:nowrap;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.tx-amount.pos{color:var(--success)}
.tx-amount.neg{color:var(--danger)}
/* Not a button: it names a command the user types in the bot, so it must not
   look tappable here. */
.tx-more{padding:12px 0 2px;font-size:12px;color:var(--text3)}

/* Deposit Section */
.deposit-box{background:var(--card2);border:1px solid var(--border);border-radius:var(--radius);padding:12px;display:flex;align-items:center;gap:12px;margin-top:8px}
.deposit-addr{font-size:12px;color:var(--text2);word-break:break-all;flex:1;user-select:all;font-family:var(--font-mono)}
.wd-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;color:var(--text3);padding:5px 0}
.wd-row b{color:var(--text);font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:500}
/* QR readers need a light quiet zone in both themes, so this one box stays white. */
.deposit-qr{width:80px;height:80px;border-radius:var(--radius);border:1px solid var(--border);background:#fff;padding:4px;flex-shrink:0}
.deposit-qr img{width:100%;height:100%;display:block}

/* Modal / Bottom Sheet */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--scrim);z-index:200;display:none;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .25s var(--ease)}
.modal-overlay.show{display:flex;opacity:1}
.modal-sheet{background:var(--card);border-top:1px solid var(--border);border-radius:var(--radius-lg) var(--radius-lg) 0 0;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;padding:14px 16px calc(20px + var(--safe-b));transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1)}
.modal-overlay.show .modal-sheet{transform:translateY(0)}
.modal-handle{width:32px;height:3px;background:var(--border-strong);border-radius:var(--pill);margin:0 auto 16px}
.modal-title{font-size:17px;font-weight:600;letter-spacing:-.02em;margin-bottom:14px}

/* Toast */
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-80px);background:var(--card);border:1px solid var(--border-strong);border-radius:var(--pill);padding:10px 18px;font-size:13px;font-weight:500;z-index:300;transition:transform .3s cubic-bezier(.32,.72,0,1);pointer-events:none;max-width:calc(100% - 32px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.success{border-color:var(--success);color:var(--success)}
.toast.error{border-color:var(--danger);color:var(--danger)}

/* Detail View */
.detail-view{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:150;overflow-y:auto;max-width:480px;margin:0 auto}
.detail-header{position:sticky;top:0;z-index:10;background:var(--nav-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:10px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);min-height:52px}
.detail-back{width:32px;height:32px;border-radius:var(--pill);border:1px solid var(--border-strong);display:flex;align-items:center;justify-content:center;color:var(--text);flex-shrink:0;cursor:pointer;transition:border-color .2s var(--ease)}
.detail-back:hover,.detail-back:active{border-color:var(--text)}
.detail-back .icon{width:16px;height:16px}
.detail-title{font-size:15px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.01em}
.detail-body{padding:16px}
.detail-question{font-size:19px;font-weight:600;line-height:1.35;letter-spacing:-.02em;margin-bottom:14px}
.detail-options{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.detail-opt{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;display:block;width:100%;text-align:left}
.detail-opt-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.detail-opt-name{font-weight:500;font-size:14px}
.detail-opt-name.win{color:var(--accent-text);font-weight:600}
.detail-opt-pct{font-size:18px;font-weight:500;color:var(--accent-text);font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.detail-opt-bar{height:4px;border-radius:var(--pill);background:var(--card3);overflow:hidden}
.detail-opt-bar-fill{height:100%;border-radius:var(--pill);background:var(--accent);transition:width .4s var(--ease)}
.detail-opt.pickable{cursor:pointer;transition:border-color .2s var(--ease),background-color .2s var(--ease)}
.detail-opt.pickable:active{border-color:var(--accent)}
.detail-opt.selected{border-color:var(--accent);background:var(--blue-soft)}
.buy-panel{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--border);padding:12px 0 6px}
.buy-panel .input{margin-bottom:10px}

/* Create Form */
.create-options{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.create-opt-row{display:flex;gap:8px;align-items:center}
.create-opt-row .input{flex:1}
.create-opt-rm{width:32px;height:32px;border-radius:var(--pill);background:var(--danger-bg);display:flex;align-items:center;justify-content:center;color:var(--danger);cursor:pointer;flex-shrink:0}
.create-opt-rm .icon{width:14px;height:14px}
.create-add{background:none;border:1px dashed var(--border-strong);border-radius:var(--radius);padding:10px;color:var(--text3);font-size:13px;font-weight:500;width:100%;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:border-color .2s var(--ease),color .2s var(--ease)}
.create-add:hover,.create-add:active{border-color:var(--accent-text);color:var(--accent-text)}
.create-add .icon{width:13px;height:13px}

/* Language items */
.lang-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:var(--radius);cursor:pointer;border:1px solid transparent;transition:background-color .2s var(--ease),border-color .2s var(--ease)}
.lang-item:active{background:var(--card2)}
.lang-item.active{background:var(--blue-soft);border-color:var(--accent)}
.lang-name{font-size:14px;font-weight:500}
.lang-check{margin-left:auto;color:var(--accent-text);display:none}
.lang-item.active .lang-check{display:block}
.lang-check .icon{width:16px;height:16px}

/* Top users */
.top-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.top-item:last-child{border-bottom:none}
.top-rank{width:22px;font-size:13px;font-weight:500;color:var(--text4);text-align:center;font-family:var(--font-mono)}
.top-rank.lead{color:var(--accent-text)}
.top-name{flex:1;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-vol{font-size:13px;color:var(--text2);font-weight:500;font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}

/* Stats */
.stats-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}
.stat-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 8px;text-align:center}
.stat-val{font-size:18px;font-weight:500;font-family:var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat-label{font-size:10px;color:var(--text3);margin-top:3px;letter-spacing:.06em;text-transform:uppercase}

/* Section title */
.section-title{font-size:11px;color:var(--text3);font-weight:500;text-transform:uppercase;letter-spacing:.09em;margin:18px 0 8px}

/* Empty state */
.empty{text-align:center;padding:30px 16px;color:var(--text3);font-size:13px;border:1px dashed var(--border);border-radius:var(--radius)}

/* Page-local layout helpers (they replace per-element style="" attributes) */
[hidden]{display:none!important}
.card-compact{padding:12px}
.sheet-gap{margin-bottom:14px}
.gap-top{margin-top:12px}
.gap-top-sm{margin-top:8px}
.sheet-note{font-size:13px;color:var(--text2);margin:0 0 12px}
.hint-block{margin:0 0 12px}
.mini-label{font-size:11px;color:var(--text3);margin:0 0 4px}
.mini-label.late{margin:10px 0 0}
.deposit-col{flex:1;min-width:0}
.sw-state{font-size:13px;color:var(--text2);margin-bottom:8px}
.sw-addr{font-size:12px;color:var(--text);word-break:break-all}
.sw-bal{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:10px;font-size:13px;color:var(--text3)}
.sw-bal .mono{font-size:18px;color:var(--text);letter-spacing:-.02em}
.sw-card .hint{margin-top:8px}
.ai-chat{max-height:200px;overflow-y:auto;margin-bottom:10px;font-size:13px;color:var(--text2)}
.ai-row{display:flex;gap:8px}
.ai-row .input{flex:1}
.ai-item{margin-bottom:6px}
/* The assistant is the one card that renders as an empty box until someone types, so it says what it answers. */
.ai-hint{color:var(--text3);font-size:13px;margin-bottom:6px}
.ai-item .who{font-weight:500;color:var(--accent-text)}
.ai-item.ans .who{color:var(--success)}
.ai-item.pending{color:var(--text4)}
.ai-item.err{color:var(--danger)}
.market-line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--border);font-size:13px}
.market-line .num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--accent-text);font-weight:500}
.pot-line{font-size:13px;color:var(--text3);margin-bottom:8px}
.pot-line b{color:var(--text);font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:500}
.won-line{font-size:13px;font-weight:600;color:var(--accent-text);margin-bottom:8px}
.oc-title{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.oc-title .q{font-size:15px;font-weight:500;line-height:1.4;letter-spacing:-.01em}
.shares{margin-top:6px;font-size:12px;color:var(--accent-text)}
.deadline{font-size:13px;color:var(--text3);margin-bottom:10px}
.action-card{margin-top:12px;cursor:pointer;display:flex;align-items:center;gap:8px}
.action-card .icon{width:16px;height:16px;color:var(--accent-text);flex-shrink:0}
.about{font-size:14px;line-height:1.6;color:var(--text2)}
.about b{color:var(--text);font-weight:600}
.about .by{margin-top:6px;color:var(--text3);font-size:13px}

/* Thumb targets. The Mini App is a phone surface but it also opens in the
   desktop Base App, so the 44px floor is keyed to the pointer, not the width. */
@media (pointer: coarse){
  .theme-toggle{width:44px;height:44px}
  .balance-chip,.chip,.action-card{min-height:44px}
  .detail-back,.create-opt-rm{width:44px;height:44px}
  .lang-item{min-height:48px}
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

let STATE = { lang: window.__seedLang || 'en', balance_usdc: 0, deposit_address: '', markets: [], bets: [], onchain_markets: [], history: [], history_truncated: false, top: [], recent_tips: [], stats: null, username: '', tg_id: null, linked_address: '', authStale: false };
let currentTab = 0;
let toastTimer = null;

// ─── i18n ───
function t(key) { return (I18N[STATE.lang] && I18N[STATE.lang][key]) || I18N.en[key] || key; }
function icon(name, cls) { return `<svg class="${cls || 'icon'}" viewBox="0 0 24 24" aria-hidden="true"><use href="#${name}"/></svg>`; }
function applyI18n() {
  document.documentElement.lang = STATE.lang;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  document.querySelectorAll('[data-i18n-label]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.i18nLabel)); });
}

// ─── Toast ───
function toast(msg, type = 'success') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast ' + type;
  clearTimeout(toastTimer);
  requestAnimationFrame(() => { el.classList.add('show'); });
  toastTimer = setTimeout(() => { el.classList.remove('show'); }, 2500);
}

// ─── Tab switching ───
function switchTab(i) {
  currentTab = i;
  document.querySelectorAll('.tab-page').forEach((p, idx) => p.classList.toggle('active', idx === i));
  document.querySelectorAll('.tab-item').forEach((el, idx) => {
    el.classList.toggle('active', idx === i);
    if (idx === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  document.getElementById('contentArea').scrollTop = 0;
  hideDetail();
}

// ─── Modal ───
/* The sheet is the whole way every action in this app happens, so it behaves
   like a dialog: it names itself after its own title, takes focus on the way
   in and gives it back on the way out, and closes on Escape and on Telegram's
   hardware/gesture back button. Before this the only way out was to find the
   scrim with a thumb. */
let sheetReturnFocus = null;

/* Telegram draws its own back chevron in the app header. It has to unwind the
   layer the user is looking at — hiding it while a sheet is open leaves the
   only exit as the scrim, and pressing the client's back closes the Mini App
   with the sheet still up. HeaderButton is SDK 7, BackButton before it. */
function syncBackButton() {
  const tg = window.Telegram?.WebApp;
  const bb = tg && (tg.HeaderButton || tg.BackButton);
  if (!bb || typeof bb.show !== 'function') return;
  const open = document.getElementById('modalOverlay').classList.contains('show')
    || !document.getElementById('detailView').hidden;
  if (open) bb.show(); else bb.hide();
}

function openModal(html) {
  const content = document.getElementById('modalContent');
  content.innerHTML = html;
  const sheet = document.getElementById('modalSheet');
  const title = content.querySelector('.modal-title');
  if (title) sheet.setAttribute('aria-label', title.textContent.trim());
  sheetReturnFocus = document.activeElement;
  document.getElementById('modalOverlay').classList.add('show');
  const first = sheet.querySelector('input, select, textarea, button');
  if (first) first.focus();
  syncBackButton();
}
function closeModal(e) {
  if (e && e.target !== document.getElementById('modalOverlay') && e.type === 'click') return;
  closeModalForce();
}
function closeModalForce() {
  document.getElementById('modalOverlay').classList.remove('show');
  if (sheetReturnFocus && document.contains(sheetReturnFocus)) sheetReturnFocus.focus();
  sheetReturnFocus = null;
  syncBackButton();
}
/* Topmost layer first: with a sheet open over a market detail, Escape drops the
   sheet and leaves the detail, which is what the stack looks like visually. */
function dismissTopLayer() {
  if (document.getElementById('modalOverlay').classList.contains('show')) { closeModalForce(); return true; }
  const dv = document.getElementById('detailView');
  if (!dv.hidden) { hideDetail(); return true; }
  return false;
}

// ─── Detail View ───
let detailReturnFocus = null;
function showDetail(html) {
  const dv = document.getElementById('detailView');
  dv.innerHTML = html;
  dv.hidden = false;
  detailReturnFocus = document.activeElement;
  const first = dv.querySelector('button, input, select, textarea');
  if (first) first.focus();
  syncBackButton();
}
function hideDetail() {
  document.getElementById('detailView').hidden = true;
  if (detailReturnFocus && document.contains(detailReturnFocus)) detailReturnFocus.focus();
  detailReturnFocus = null;
  syncBackButton();
}

// ─── Auth + Load ───
async function init() {
  const tg = window.Telegram?.WebApp;
  if (tg?.onEvent) tg.onEvent('backButtonClicked', dismissTopLayer);
  const initData = tg ? (tg.initData || '') : '';
  if (initData) {
    try {
      const r = await fetch('/api/mini/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ initData })
      });
      // 403 here means the blob the webview is holding is too old to mint a
      // session. Saying "open in Telegram" to someone who IS in Telegram is a
      // dead end, so remember the real reason and report that instead.
      if (r.status === 403) STATE.authStale = true;
    } catch(e) { console.error('auth error', e); }
  }
  await loadState();
}

async function addMiniApp() {
  const sdk = window.__fcSdk;
  if (sdk) {
    try { await sdk.actions.addMiniApp(); } catch(e) { toast(t('add_app_error'), 'error'); }
  }
}

async function loadState() {
  // Nothing can authorise this call before the state has ever loaded: the
  // session cookie is HttpOnly (the server tells us if it exists) and outside
  // Telegram/Base App there is no initData to exchange for one. Render the
  // empty shell instead of firing a request that only answers 401.
  const tg = window.Telegram?.WebApp;
  if (STATE.tg_id === null && !(tg && tg.initData)
      && document.documentElement.dataset.signedIn !== '1') {
    renderAll();
    toast(t('open_in_app'), 'error');
    return;
  }
  try {
    const r = await fetch('/api/mini/state', { credentials: 'same-origin' });
    if (r.ok) {
      const d = await r.json();
      Object.assign(STATE, d);
      renderAll();
      loadSmartWallet();
      loadStats();
    } else if (r.status === 401) {
      // Opened outside Telegram/Base App there is no initData to sign, so no
      // session ever exists. Render the tabs empty rather than leaving blank
      // sections behind a generic error toast. If the initData WAS sent and the
      // server refused it, the honest message is "reopen the app", not "open it".
      renderAll();
      toast(STATE.authStale ? t('auth_stale') : t('open_in_app'), 'error');
    } else {
      toast(t('load_error'), 'error');
    }
  } catch(e) {
    console.error('state error', e);
    toast(t('network_error'), 'error');
  }
}

function renderAll() {
  applyI18n();
  renderBalance();
  renderHistory();
  renderMarkets();
  renderBets();
  renderMore();
  updateLangHighlight();
}

function renderBalance() {
  // No session means no known balance: rendering 0.00 reads as "this account is
  // empty" rather than "we cannot tell who you are yet".
  const known = STATE.tg_id !== null && STATE.tg_id !== undefined;
  const bal = known ? usdc(STATE.balance_usdc) : '--';
  document.getElementById('balanceDisplay').textContent = bal + ' USDC';
  document.getElementById('bigBalance').textContent = bal;
}

async function loadSmartWallet() {
  const card = document.getElementById('smartWalletCard');
  if (!card) return;
  try {
    const r = await fetch('/api/mini/smartwallet', { credentials: 'same-origin' });
    if (r.status === 503 || !r.ok) {
      card.hidden = true;
      return;
    }
    const d = await r.json();
    card.hidden = false;
    const addrEl = document.getElementById('swAddress');
    addrEl.textContent = d.address;
    addrEl.dataset.addr = d.address;
    document.getElementById('swBalance').textContent = usdc(d.balance_usdc);
    document.getElementById('swDeployed').textContent = d.deployed ? t('smart_deployed') : t('smart_not_deployed');
    document.getElementById('swDepositHint').textContent = d.deployed ? t('smart_enabled') : t('smart_deposit_hint');
  } catch(e) {
    card.hidden = true;
  }
}

/* The «Ещё» tab has always had a Stats block, and it has always shown three
   dashes: /api/mini/state never carried global counters, and the client read
   STATE.stats anyway. /api/stats is public, TTL-cached server-side and already
   answers the landing page, so the app asks it instead of growing a second
   aggregate into the authenticated state payload. */
async function loadStats() {
  try {
    const r = await fetch('/api/stats', { credentials: 'same-origin' });
    if (!r.ok) return;
    const d = await r.json();
    STATE.stats = { users: d.users, volume: d.volume_usdc, tips: d.tips_usdc };
    renderMore();
  } catch(e) { /* the three numbers stay '--' — the rest of the tab is real */ }
}

/* Amounts read with the interface separators, not a raw toFixed. */
function usdc(v) { return Number(v || 0).toLocaleString(locale(), { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function num(v) { return v == null || v === '' ? '--' : Number(v).toLocaleString(locale(), { maximumFractionDigits: 0 }); }

function timeLabel(epochSec) {
  if (!epochSec) return '';
  return new Date(epochSec * 1000).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function statusTag(m) {
  if (m.cancelled) return `<span class="tag tag-cancelled">${t('st_cancelled')}</span>`;
  if (m.resolved) return `<span class="tag tag-resolved">${t('st_resolved')}</span>`;
  return `<span class="tag tag-open">${t('st_open')}</span>`;
}

/* One brand blue for every option bar: the label and the percentage carry the
 * meaning, the fill only shows weight. Winner options get the accent text colour. */
function probBars(opts, pctKey, winnerIdx) {
  const rows = (opts || []).map(o => {
    const pct = Number(o[pctKey] || 0);
    const win = winnerIdx != null && o.index === winnerIdx;
    return `<div>
      <div class="prob-bar-label"><span${win ? ' class="win"' : ''}>${esc(o.label || o.name || '—')}</span><span class="num${win ? ' win' : ''}">${pct.toFixed(1)}%</span></div>
      <div class="prob-bar"><div class="prob-bar-fill" style="width:${Math.max(pct, 1)}%"></div></div>
    </div>`;
  }).join('');
  return `<div class="prob-bars">${rows}</div>`;
}

function renderHistory() {
  const c = document.getElementById('historyList');
  const h = STATE.history || [];
  if (!h.length) { c.innerHTML = `<div class="empty">${t('no_history')}</div>`; return; }
  // Label, sign and the counterparty come from the server (bot/tx_view):
  // tx_log amounts are always positive, so guessing here shows a withdrawal
  // as income. created_at is epoch seconds, not milliseconds.
  c.innerHTML = h.map(tx => {
    const dir = tx.incoming ? 'in' : 'out';
    const sub = [tx.ref, tx.note].filter(Boolean).join(' — ');
    return `<div class="tx-item">
      <span class="tx-icon ${dir}">${icon(dir === 'in' ? 'i-down' : 'i-up')}</span>
      <div class="tx-details">
        <div class="tx-title">${esc(tx.label || tx.kind || '')}${sub ? ' <span class="tx-time">' + esc(sub) + '</span>' : ''}</div>
        <div class="tx-time">${timeLabel(Number(tx.created_at || 0))}</div>
      </div>
      <div class="tx-amount ${tx.incoming ? 'pos' : 'neg'}">${tx.incoming ? '+' : '−'}${usdc(tx.amount_usdc)}</div>
    </div>`;
  }).join('') + (STATE.history_truncated
    // The server says whether it stopped short: a 10-row history and a truncated
    // 10-row history are indistinguishable from the client otherwise.
    ? `<div class="tx-more">${t('history_more')}</div>` : '');
}

function renderMarkets() {
  const c = document.getElementById('marketsList');
  const m = STATE.markets || [];
  if (!m.length) { c.innerHTML = `<div class="empty">${t('no_markets')}</div>`; return; }
  c.innerHTML = m.map(mk => {
    const opts = mk.options || [];
    return `<button class="market-card" data-act="openMarketDetail" data-id="${mk.id}">
      <div class="market-question">${esc(mk.question)}</div>
      ${probBars(opts, 'price_pct')}
      <div class="market-meta"><span>${t('options')}: ${opts.length}</span><span>${t('traders')}: ${mk.traders || 0}</span></div>
    </button>`;
  }).join('') + ocBlock();
}

function ocBlock() {
  const oc = STATE.onchain_markets || [];
  if (!oc.length) return '';
  return `<div class="section-title">${t('onchain')}</div>` + oc.map(ocCard).join('');
}

function ocCard(m) {
  const close = m.close_at && !m.resolved && !m.cancelled ? timeLabel(m.close_at) : '';
  return `<button class="market-card" data-act="openOcDetail" data-id="${m.id}">
    <div class="oc-title"><span class="q">#${m.id} ${esc(m.question)}</span>${statusTag(m)}</div>
    ${probBars(m.options || [], 'price_pct', m.resolved ? m.winner : null)}
    <div class="market-meta"><span>ERC-1155 · USDC</span>${close ? `<span>${t('deadline')}: ${close}</span>` : ''}</div>
  </button>`;
}

function ocTradeHint(id) {
  return t('onchain_hint').replace('{id}', id);
}

function locale() {
  return { ru: 'ru-RU', en: 'en-US', zh: 'zh-CN' }[STATE.lang] || navigator.language || 'en-US';
}

function formatShares(micro) {
  return (Number(micro || 0) / 1e6).toLocaleString(locale(), { maximumFractionDigits: 2 });
}

function detailShell(title, body, tag) {
  return `<div class="detail-header">
      <button class="detail-back" data-act="hideDetail" aria-label="${esc(t('back'))}">${icon('i-left')}</button>
      <div class="detail-title">${title}</div>${tag || ''}
    </div>
    <div class="detail-body">${body}</div>`;
}

function actionCard(iconName, msg) {
  return `<button class="card action-card" data-act="toast" data-msg="${esc(msg)}">${icon(iconName)}<span>${esc(msg)}</span></button>`;
}

async function openOcDetail(id) {
  showDetail(detailShell('#' + id, `<div class="empty">…</div>`));
  try {
    const r = await fetch('/api/mini/onchain/' + id, { credentials: 'same-origin' });
    if (!r.ok) throw new Error();
    const mk = await r.json();
    const opts = mk.options || [];
    const close = mk.close_at && !mk.resolved && !mk.cancelled ? timeLabel(mk.close_at) : '';
    const rows = opts.map(o => {
      const pct = Number(o.price_pct || 0);
      const win = mk.resolved && mk.winner === o.index;
      const mine = o.shares > 0 ? `<div class="shares">${t('your_shares')}: ${formatShares(o.shares)}</div>` : '';
      return `<div class="detail-opt">
        <div class="detail-opt-head">
          <div class="detail-opt-name${win ? ' win' : ''}">${esc(o.label || '—')}</div>
          <div class="detail-opt-pct">${pct.toFixed(1)}%</div>
        </div>
        <div class="detail-opt-bar"><div class="detail-opt-bar-fill" style="width:${Math.max(pct, 1)}%"></div></div>
        ${mine}
      </div>`;
    }).join('');
    const heldWinner = mk.resolved && opts.some(o => o.index === mk.winner && o.shares > 0);
    let actions = '';
    if (heldWinner) actions = `<div class="won-line">${t('you_won')}</div>` + actionCard('i-check', t('oc_redeem_hint').replace('{id}', id));
    else if (!mk.resolved && !mk.cancelled) actions = actionCard('i-send', ocTradeHint(id));
    showDetail(detailShell('#' + mk.id, `
      <div class="detail-question">${esc(mk.question)}</div>
      ${close ? `<div class="deadline">${t('deadline')}: ${close}</div>` : ''}
      <div class="detail-options">${rows}</div>
      ${actions}`, statusTag(mk)));
  } catch (e) {
    hideDetail();
    toast(t('onchain_load_fail'), 'error');
  }
}

function renderBets() {
  const c = document.getElementById('betsList');
  const b = STATE.bets || [];
  if (!b.length) { c.innerHTML = `<div class="empty">${t('no_bets')}</div>`; return; }
  c.innerHTML = b.map(bet => {
    const opts = bet.options || [];
    const lines = opts.map(o => `<div class="market-line"><span>${esc(o.label || o.name || '—')}</span><span class="num">${Number(o.chance_pct || 0).toFixed(1)}%</span></div>`).join('');
    return `<button class="market-card" data-act="openBetDetail" data-id="${bet.id}">
      <div class="market-question">${esc(bet.question)}</div>
      <div class="pot-line">${t('pot')}: <b>${usdc(bet.pot_usdc || bet.pot)} USDC</b></div>
      ${lines}
    </button>`;
  }).join('');
}

function renderMore() {
  document.getElementById('aboutCard').innerHTML = `<div class="about">
    <b>Tippy</b> — ${t('about_text')}
    <div class="by"><a href="https://github.com/ssrjkk" target="_blank" rel="noopener">@ssrjkk</a> · <a href="/tos" target="_blank" rel="noopener">${t('tos')}</a></div>
  </div>`;

  const top = STATE.top || [];
  // The row the user reads is a handle only when it really is a Telegram
  // username: the server also answers with `id123` and `name.base.eth`, and
  // '@id9000007' is not a handle. `total_usdc` is the field the payload
  // carries — reading a name that does not exist here rendered 0,00 for every
  // leader since the block was written.
  document.getElementById('topList').innerHTML = top.slice(0, 5).map((u, i) => `<div class="top-item">
      <div class="top-rank${i === 0 ? ' lead' : ''}">${i + 1}</div>
      <div class="top-name">${esc(u.handle || u.username || '?')}</div>
      <div class="top-vol">${usdc(u.total_usdc)} USDC</div>
    </div>`).join('') || `<div class="empty">${t('no_top')}</div>`;

  document.getElementById('statUsers').textContent = num(STATE.stats?.users);
  document.getElementById('statVolume').textContent = num(STATE.stats?.volume);
  document.getElementById('statTips').textContent = num(STATE.stats?.tips);
}

function updateLangHighlight() {
  document.querySelectorAll('.lang-item').forEach(el => {
    el.classList.toggle('active', (el.dataset.lang || '') === STATE.lang);
  });
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// FastAPI puts the rejection reason in `detail`; a non-error response carries
// `error`. Without both, every refusal toast says just "Error".
function errMsg(d, status) {
  if (status === 409) return t('dup_request');
  return (d && (d.error || d.detail)) || t('error_generic');
}

/* The money endpoints reserve an Idempotency-Key so a retried request cannot
   spend twice. One key per action, kept while the attempt is unresolved (the
   server rolls the reservation back on failure, so the retry replays it) and
   replaced once the server accepted the action. */
const _idemKeys = {};
function idemKey(action) {
  return _idemKeys[action] || (_idemKeys[action] = crypto.randomUUID?.() || String(Date.now()) + Math.random().toString(36).slice(2));
}
function resetIdem(action) { delete _idemKeys[action]; }
function moneyHeaders(action) {
  return { 'Content-Type': 'application/json', 'Idempotency-Key': idemKey(action) };
}

// ─── Tip ───
function openTipSheet() {
  // Typing a handle from memory is the slow path; the people a user already
  // tips are returned by /api/mini/state and offered as chips.
  const recent = (STATE.recent_tips || []).slice(0, 6);
  const recentHtml = recent.length ? `
      <div class="input-label">${t('tip_recent')}</div>
      <div class="chips">${recent.map(r => `<button class="chip" data-act="pickTipTo" data-val="${esc(r.to)}">${esc(r.label)}</button>`).join('')}</div>` : '';
  openModal(`
    <div class="modal-title">${t('send_tip')}</div>
    <div class="input-group">
      <label class="input-label">${t('username')}</label>
      <input class="input" id="tipTo" placeholder="@username" autocomplete="off">${recentHtml}
    </div>
    <div class="input-group">
      <label class="input-label">${t('amount')} (USDC)</label>
      <div class="chips" id="tipChips">
        <button class="chip" data-act="pickChip" data-target="tipAmt" data-val="1">1</button>
        <button class="chip active" data-act="pickChip" data-target="tipAmt" data-val="5">5</button>
        <button class="chip" data-act="pickChip" data-target="tipAmt" data-val="10">10</button>
        <button class="chip" data-act="pickChip" data-target="tipAmt" data-val="25">25</button>
      </div>
      <input class="input" id="tipAmt" type="number" step="0.01" min="0" value="5" placeholder="5">
    </div>
    <button class="btn btn-primary btn-full" data-act="doTip">${t('send')}</button>
  `);
}

async function doTip() {
  const to = document.getElementById('tipTo').value.trim().replace('@','');
  const amount = parseFloat(document.getElementById('tipAmt').value);
  if (!to || !amount || amount <= 0) { toast(t('fill_fields'), 'error'); return; }
  try {
    const r = await fetch('/api/mini/tip', {
      method: 'POST', credentials: 'same-origin',
      headers: moneyHeaders('tip'),
      body: JSON.stringify({ to, amount })
    });
    const d = await r.json();
    if (d.ok) {
      resetIdem('tip');
      STATE.balance_usdc = d.new_balance;
      renderBalance();
      closeModalForce();
      toast('+' + usdc(amount) + ' USDC → @' + to);
      loadState();
    } else { toast(errMsg(d, r.status), 'error'); }
  } catch(e) { toast(t('network_error'), 'error'); }
}

// ─── Deposit ───
function openDepositSheet() {
  const addr = STATE.deposit_address || STATE.linked_address || t('connect_wallet');
  openModal(`
    <div class="modal-title">${t('deposit_title')}</div>
    <p class="sheet-note">${STATE.linked_address ? t('linked') : t('deposit_note')}</p>
    <div class="deposit-box">
      <div class="deposit-qr"><img src="/qr?data=${encodeURIComponent(addr)}" alt="QR"></div>
      <div class="deposit-col">
        <div class="mini-label">${t('address')}</div>
        <div class="deposit-addr" id="depAddr">${esc(addr)}</div>
        <button class="btn btn-sm btn-secondary gap-top-sm" data-act="copyAddr" data-addr="${esc(addr)}">${t('copy')}</button>
      </div>
    </div>

}

function copyAddr(addr) {
  navigator.clipboard.writeText(addr).then(() => toast(t('copied'))).catch(() => {});
}

// ─── Withdraw (two-step: stage, then confirm) ───
function openWithdrawSheet() {
  openModal(`
    <div class="modal-title">${t('withdraw')}</div>
    <div class="input-group">
      <label class="input-label">${t('address')}</label>
      <input class="input" id="wdAddr" placeholder="0x..." autocomplete="off">
    </div>
    <div class="input-group">
      <label class="input-label">${t('amount')} (USDC)</label>
      <input class="input" id="wdAmt" type="number" step="0.01" min="0" placeholder="0.00">
    </div>
    <p class="hint hint-block">${t('wd_hint')}</p>
    <button class="btn btn-primary btn-full" data-act="stageWithdraw">${t('withdraw')}</button>
  `);
}

let _wdBusy = false;

async function stageWithdraw() {
  if (_wdBusy) return;
  const addr = document.getElementById('wdAddr').value.trim();
  const raw = document.getElementById('wdAmt').value.trim();
  if (!addr || !raw || !(parseFloat(raw) > 0)) { toast(t('fill_fields'), 'error'); return; }
  _wdBusy = true;
  try {
    const r = await fetch('/api/mini/withdraw', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ address: addr, amount: raw })
    });
    const d = await r.json();
    if (d.ok && d.staged) showWithdrawConfirm(d);
    else toast(errMsg(d, r.status), 'error');
  } catch(e) { toast(t('network_error'), 'error'); }
  finally { _wdBusy = false; }
}

function showWithdrawConfirm(d) {
  const tok = esc(d.token);
  openModal(`
    <div class="modal-title">${t('wd_confirm_title')}</div>
    <div class="input-group">
      <div class="wd-row"><span>${t('amount')}</span><b>${esc(d.amount)} USDC</b></div>
      <div class="wd-row"><span>${t('wd_fee')}</span><b>${esc(d.fee)} USDC</b></div>
      <div class="wd-row"><span>${t('wd_total')}</span><b>${esc(d.total)} USDC</b></div>
      <div class="wd-row"><span>${t('wd_after')}</span><b>${esc(d.balance_after)} USDC</b></div>
      <div class="mini-label late">${t('address')}</div>
      <div class="deposit-addr">${esc(d.address)}</div>
    </div>
    <p class="hint hint-block">${t('wd_check')}</p>
    <button class="btn btn-primary btn-full" data-act="confirmWithdraw" data-token="${tok}" data-yes="1">${t('wd_confirm_btn')}</button>
    <button class="btn btn-secondary btn-full gap-top-sm" data-act="confirmWithdraw" data-token="${tok}" data-yes="0">${t('wd_cancel_btn')}</button>
  `);
}

async function confirmWithdraw(token, yes) {
  if (_wdBusy) return;
  _wdBusy = true;
  try {
    const r = await fetch('/api/mini/withdraw/confirm', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, confirm: !!yes })
    });
    const d = await r.json();
    if (r.ok && d.ok) {
      STATE.balance_usdc = d.new_balance;
      renderBalance();
      closeModalForce();
      toast(t('wd_queued'), 'success');
      loadState();
    } else if (r.ok) {
      closeModalForce();
      toast(t('wd_cancelled'));
    } else {
      toast(errMsg(d, r.status), 'error');
    }
  } catch(e) { toast(t('network_error'), 'error'); }
  finally { _wdBusy = false; }
}

// ─── Market / Bet Detail ───
/* One buy panel per screen: tapping an option selects it and the single CTA names
 * that option, so a four-option market does not repeat the same button four times. */
let BUY = null;

function optionLabel(o, i) { return o.label || o.name || String(i + 1); }

function optRows(opts, pctKey) {
  return (opts || []).map((o, i) => {
    const pct = Number(o[pctKey] || 0);
    return `<button class="detail-opt pickable${i === 0 ? ' selected' : ''}" data-act="pickOpt" data-i="${i}">
      <div class="detail-opt-head">
        <div class="detail-opt-name">${esc(optionLabel(o, i))}</div>
        <div class="detail-opt-pct">${pct.toFixed(1)}%</div>
      </div>
      <div class="detail-opt-bar"><div class="detail-opt-bar-fill" style="width:${Math.max(pct, 1)}%"></div></div>
    </button>`;
  }).join('');
}

function buyPanel() {
  const chips = [1, 5, 10, 25].map(v =>
    `<button class="chip${v === 5 ? ' active' : ''}" data-act="pickChip" data-target="tradeAmt" data-val="${v}">${v}</button>`).join('');
  return `<div class="buy-panel">
    <div class="chips">${chips}</div>
    <input class="input" id="tradeAmt" type="number" step="0.01" min="0" value="5" placeholder="5" inputmode="decimal" aria-label="${esc(t('amount'))}">
    <button class="btn btn-primary btn-full" id="buyBtn" data-act="buy"></button>
  </div>`;
}

function setBuyLabel() {
  const btn = document.getElementById('buyBtn');
  if (btn && BUY) btn.textContent = `${t('buy')} ${optionLabel(BUY.opts[BUY.opt] || {}, BUY.opt)}`;
}

function pickOpt(el) {
  if (!BUY) return;
  BUY.opt = parseInt(el.dataset.i, 10) || 0;
  el.parentElement.querySelectorAll('.detail-opt').forEach(o => o.classList.toggle('selected', o === el));
  setBuyLabel();
}

function openMarketDetail(id) {
  const mk = (STATE.markets || []).find(m => m.id == id);
  if (!mk) return;
  const opts = mk.options || [];
  BUY = { kind: 'mkt', id: mk.id, opts, opt: 0 };
  showDetail(detailShell(t('kind_market'), `
      <div class="detail-question">${esc(mk.question)}</div>
      <div class="market-meta sheet-gap"><span>${t('options')}: ${opts.length}</span><span>${t('traders')}: ${mk.traders || 0}</span></div>
      <div class="detail-options">${optRows(opts, 'price_pct')}</div>
      ${buyPanel()}`));
  setBuyLabel();
}

function openBetDetail(id) {
  const bet = (STATE.bets || []).find(b => b.id == id);
  if (!bet) return;
  const opts = bet.options || [];
  BUY = { kind: 'bet', id: bet.id, opts, opt: 0 };
  showDetail(detailShell(t('kind_bet'), `
      <div class="detail-question">${esc(bet.question)}</div>
      <div class="pot-line">${t('pot')}: <b>${usdc(bet.pot_usdc || bet.pot)} USDC</b></div>
      <div class="detail-options">${optRows(opts, 'chance_pct')}</div>
      ${buyPanel()}`));
  setBuyLabel();
}

async function doBuy() {
  if (!BUY) return;
  const amt = parseFloat(document.getElementById('tradeAmt').value);
  if (!amt || amt <= 0) { toast(t('fill_fields'), 'error'); return; }
  const isMarket = BUY.kind === 'mkt';
  const action = isMarket ? 'trade' : 'betplace';
  const body = { option: BUY.opt, amount: amt };
  body[isMarket ? 'market_id' : 'bet_id'] = BUY.id;
  try {
    const r = await fetch(isMarket ? '/api/mini/trade' : '/api/mini/betplace', {
      method: 'POST', credentials: 'same-origin',
      headers: moneyHeaders(action),
      body: JSON.stringify(body)
    });
    const d = await r.json();
    if (d.ok) {
      resetIdem(action);
      STATE.balance_usdc = d.new_balance;
      renderBalance();
      toast(t(isMarket ? 'buy_ok' : 'bet_ok').replace('{amt}', usdc(amt)));
      hideDetail();
      loadState();
    } else { toast(errMsg(d, r.status), 'error'); }
  } catch(e) { toast(t('network_error'), 'error'); }
}

// ─── Create Market ───
function openCreateMarket() {
  openModal(`
    <div class="modal-title">${t('create_market')}</div>
    <div class="input-group">
      <label class="input-label">${t('question')}</label>
      <input class="input" id="mkQuestion" placeholder="${t('question')}" autocomplete="off">
    </div>
    <div class="input-group">
      <label class="input-label">${t('options')}</label>
      <div class="create-options" id="mkOpts">
        <div class="create-opt-row"><input class="input" placeholder="Option 1"></div>
        <div class="create-opt-row"><input class="input" placeholder="Option 2"></div>
      </div>
      <button class="create-add" data-act="addCreateOpt" data-container="mkOpts">${icon('i-plus')} ${t('add_option')}</button>
    </div>
    <div class="input-group">
      <label class="input-label">${t('hours')}</label>
      <input class="input" id="mkHours" type="number" min="1" placeholder="24">
    </div>
    <button class="btn btn-primary btn-full" data-act="doCreateMarket">${t('create')}</button>
  `);
}

function openCreateBet() {
  openModal(`
    <div class="modal-title">${t('create_bet')}</div>
    <div class="input-group">
      <label class="input-label">${t('question')}</label>
      <input class="input" id="btQuestion" placeholder="${t('question')}" autocomplete="off">
    </div>
    <div class="input-group">
      <label class="input-label">${t('options')}</label>
      <div class="create-options" id="btOpts">
        <div class="create-opt-row"><input class="input" placeholder="Option 1"></div>
        <div class="create-opt-row"><input class="input" placeholder="Option 2"></div>
      </div>
      <button class="create-add" data-act="addCreateOpt" data-container="btOpts">${icon('i-plus')} ${t('add_option')}</button>
    </div>
    <div class="input-group">
      <label class="input-label">${t('hours')}</label>
      <input class="input" id="btHours" type="number" min="1" placeholder="24">
    </div>
    <button class="btn btn-primary btn-full" data-act="doCreateBet">${t('create')}</button>
  `);
}

function addCreateOpt(containerId) {
  const c = document.getElementById(containerId);
  if (c.children.length >= 4) return;
  const n = c.children.length + 1;
  const row = document.createElement('div');
  row.className = 'create-opt-row';
  row.innerHTML = `<input class="input" placeholder="${esc(t('option'))} ${n}"><button class="create-opt-rm" data-act="rmCreateOpt" aria-label="${esc(t('remove'))}">${icon('i-minus')}</button>`;
  c.appendChild(row);
}

function rmCreateOpt(btn) {
  const row = btn.closest('.create-opt-row');
  if (!row) return;
  const container = row.parentElement;
  if (container.children.length <= 2) return;
  row.remove();
}

function getCreateOpts(containerId) {
  return Array.from(document.querySelectorAll('#' + containerId + ' .input')).map(i => i.value.trim()).filter(Boolean);
}

async function doCreateMarket() {
  const q = document.getElementById('mkQuestion').value.trim();
  const options = getCreateOpts('mkOpts');
  const hours = document.getElementById('mkHours').value ? parseInt(document.getElementById('mkHours').value) : undefined;
  if (!q || options.length < 2) { toast(t('fill_fields'), 'error'); return; }
  try {
    const r = await fetch('/api/mini/create', {
      method: 'POST', credentials: 'same-origin',
      headers: moneyHeaders('create_market'),
      body: JSON.stringify({ kind: 'market', question: q, options, hours })
    });
    const d = await r.json();
    if (d.ok) {
      resetIdem('create_market');
      closeModalForce();
      toast(t('market_created'));
      loadState();
    } else { toast(errMsg(d, r.status), 'error'); }
  } catch(e) { toast(t('network_error'), 'error'); }
}

async function doCreateBet() {
  const q = document.getElementById('btQuestion').value.trim();
  const options = getCreateOpts('btOpts');
  const hours = document.getElementById('btHours').value ? parseInt(document.getElementById('btHours').value) : undefined;
  if (!q || options.length < 2) { toast(t('fill_fields'), 'error'); return; }
  try {
    const r = await fetch('/api/mini/create', {
      method: 'POST', credentials: 'same-origin',
      // Its own key slot: sharing 'create_market' made one key string serve two
      // different actions, so a bet created after a market reused that market's
      // reservation instead of getting a fresh one.
      headers: moneyHeaders('create_bet'),
      body: JSON.stringify({ kind: 'bet', question: q, options, hours })
    });
    const d = await r.json();
    if (d.ok) {
      resetIdem('create_bet');
      closeModalForce();
      toast(t('bet_created'));
      loadState();
    } else { toast(errMsg(d, r.status), 'error'); }
  } catch(e) { toast(t('network_error'), 'error'); }
}

// ─── Language ───
async function setLang(lang) {
  STATE.lang = lang;
  localStorage.setItem('lang', lang);
  updateLangHighlight();
  applyI18n();
  renderMore();
  try {
    await fetch('/api/mini/lang', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ lang })
    });
  } catch(e) {}
}

// ─── AI Chat ───
async function askAI() {
  const input = document.getElementById('aiInput');
  const q = (input.value || '').trim();
  if (!q) return;
  input.value = '';
  const chat = document.getElementById('aiChat');
  chat.querySelector('.ai-hint')?.remove();
  chat.insertAdjacentHTML('beforeend',
    `<div class="ai-item"><span class="who">${esc(t('ai_you'))}:</span> ${esc(q)}</div><div class="ai-item pending">…</div>`);
  const pending = chat.lastElementChild;
  chat.scrollTop = chat.scrollHeight;
  try {
    const r = await fetch('/api/ask', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q, lang: STATE.lang })
    });
    const d = await r.json();
    pending.remove();
    if (r.ok) {
      // 'data' means no model answered and the ledger did — the bubble says so
      // instead of letting a lookup look like AI prose.
      const who = d.mode === 'data' ? t('ai_data_who') : t('ai_ai');
      chat.insertAdjacentHTML('beforeend',
        `<div class="ai-item ans"><span class="who">${esc(who)}:</span> ${esc(d.answer || t('ai_no_answer'))}</div>`);
    } else {
      chat.insertAdjacentHTML('beforeend', `<div class="ai-item err">${esc(errMsg(d, r.status))}</div>`);
    }
  } catch(e) {
    pending.remove();
    chat.insertAdjacentHTML('beforeend', `<div class="ai-item err">${esc(t('network_error'))}</div>`);
  }
  chat.scrollTop = chat.scrollHeight;
}

// ─── Chip picker ───
function pickChip(el, inputId, val) {
  el.parentElement.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  document.getElementById(inputId).value = val;
}

function pickTipTo(el) {
  el.parentElement.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tipTo').value = el.dataset.val;
}

// ─── Theme ───
/* The pre-paint bootstrap in <head> already resolved the saved theme; this only
   flips it and persists the choice. */
function toggleTheme() {
  var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  if (isDark) { document.documentElement.removeAttribute('data-theme'); localStorage.setItem('theme', 'light'); }
  else { document.documentElement.setAttribute('data-theme', 'dark'); localStorage.setItem('theme', 'dark'); }
}

// ─── Delegated events (CSP: no inline handlers allowed) ───
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'toggleTheme') { toggleTheme(); return; }
  if (act === 'switchTab') { switchTab(parseInt(el.dataset.tab, 10)); return; }
  if (act === 'openTipSheet') { openTipSheet(); return; }
  if (act === 'openDepositSheet') { openDepositSheet(); return; }
  if (act === 'openWithdrawSheet') { openWithdrawSheet(); return; }
  if (act === 'copyAddr') {
    if (el.dataset.addr) { copyAddr(el.dataset.addr); return; }
    const target = el.dataset.target ? document.getElementById(el.dataset.target) : null;
    if (target && target.dataset.addr) { copyAddr(target.dataset.addr); }
    return;
  }
  if (act === 'openCreateMarket') { openCreateMarket(); return; }
  if (act === 'openCreateBet') { openCreateBet(); return; }
  if (act === 'setLang') { setLang(el.dataset.lang); return; }
  if (act === 'askAI') { askAI(); return; }
  if (act === 'addMiniApp') { addMiniApp(); return; }
  if (act === 'closeModal') { if (e.target === el) closeModal(e); return; }
  if (act === 'openMarketDetail') { openMarketDetail(el.dataset.id); return; }
  if (act === 'openOcDetail') { openOcDetail(parseInt(el.dataset.id, 10)); return; }
  if (act === 'openBetDetail') { openBetDetail(el.dataset.id); return; }
  if (act === 'hideDetail') { hideDetail(); return; }
  if (act === 'toast') { toast(el.dataset.msg); return; }
  if (act === 'pickChip') { pickChip(el, el.dataset.target, parseInt(el.dataset.val, 10)); return; }
  if (act === 'pickTipTo') { pickTipTo(el); return; }
  if (act === 'doTip') { doTip(); return; }
  if (act === 'stageWithdraw') { stageWithdraw(); return; }
  if (act === 'confirmWithdraw') { confirmWithdraw(el.dataset.token, el.dataset.yes === '1'); return; }
  if (act === 'pickOpt') { pickOpt(el); return; }
  if (act === 'buy') { doBuy(); return; }
  if (act === 'addCreateOpt') { addCreateOpt(el.dataset.container); return; }
  if (act === 'doCreateMarket') { doCreateMarket(); return; }
  if (act === 'doCreateBet') { doCreateBet(); return; }
  if (act === 'rmCreateOpt') { rmCreateOpt(el); return; }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target && e.target.id === 'aiInput') askAI();
  if (e.key === 'Escape') dismissTopLayer();
});

// ─── Start ───
init();
</script>
