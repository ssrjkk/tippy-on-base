<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tippy</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%230052ff'/%3E%3Ctext x='50' y='71' font-size='58' font-weight='800' text-anchor='middle' fill='white'%3Eb%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .auth-card { max-width: 400px; width: 100%; margin: 20px; padding: 40px; background: var(--card); border: 1px solid var(--border); border-radius: 20px; box-shadow: var(--shadow-lg); }
    .auth-card h1 { font-size: 28px; margin-bottom: 8px; text-align: center; }
    .auth-card .subtitle { color: var(--text-secondary); text-align: center; margin-bottom: 32px; font-size: 15px; }
    .auth-btn { width: 100%; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 12px; transition: all 0.2s; cursor: pointer; border: none; text-decoration: none; }
    .auth-btn.telegram { background: #229ED9; color: #fff; }
    .auth-btn.telegram:hover { background: #1a8bc0; }
    .auth-btn.wallet { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .auth-btn.wallet:hover { border-color: var(--accent); }
    .divider { text-align: center; color: var(--muted); font-size: 14px; margin: 20px 0; position: relative; }
    .divider::before, .divider::after { content: ''; position: absolute; top: 50%; width: 45%; height: 1px; background: var(--border); }
    .divider::before { left: 0; }
    .divider::after { right: 0; }
  </style>
</head>
<body>
  <div class="orb orb-a" aria-hidden="true"></div>
  <div class="orb orb-b" aria-hidden="true"></div>

  <div class="auth-card">
    <h1>Tippy</h1>
    <p class="subtitle">Войдите для доступа к приложению</p>

    <a href="/login" class="auth-btn telegram">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.446 1.394c-.14.18-.357.295-.6.295-.002 0-.003 0-.005 0l.213-3.054 5.56-5.022c.24-.213-.054-.334-.373-.121l-6.869 4.326-2.96-.924c-.64-.203-.658-.64.135-.954l11.566-4.458c.538-.196 1.006.128.832.941z"/></svg>
      Войти через Telegram
    </a>

    <div class="divider">или</div>

    <button class="auth-btn wallet" id="walletLogin">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M3 10h18M7 3v4M17 3v4"/></svg>
      Подключить кошелек
    </button>
  </div>

  <script>
    (function() {
      var saved = localStorage.getItem('theme');
      if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      else if (saved === 'light') document.documentElement.removeAttribute('data-theme');
      else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();

    fetch('/api/me').then(r => {
      if (r.ok) location.href = '/app';
    }).catch(() => {});

    document.getElementById('walletLogin').onclick = async () => {
      if (!window.ethereum) {
        alert('Кошелек не найден. Установите MetaMask.');
        return;
      }
      try {
        const [addr] = await ethereum.request({method: 'eth_requestAccounts'});
        const nonce = crypto.getRandomValues(new Uint8Array(16))
          .reduce((s, b) => s + b.toString(16).padStart(2, '0'), '');
        const msg = 'Tippy login\nAddress: ' + addr +
          '\nNonce: ' + nonce +
          '\nExpires: ' + Math.floor(Date.now() / 1000 + 600);
        const sig = await ethereum.request({method: 'personal_sign', params: [msg, addr]});
        const r = await fetch('/api/auth/wallet', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({address: addr, message: msg, signature: sig})
        });
        if (r.ok) location.href = '/app';
        else {
          const err = await r.json();
          alert(err.detail || 'Ошибка входа');
        }
      } catch (e) {
        if (e.code !== 4001) alert(e.message);
      }
    };
  </script>
</body>
</html>
