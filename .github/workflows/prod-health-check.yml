name: Prod Health Check & Validation

on:
  push:
    branches:
      - main
  schedule:
    # Запуск каждые 6 часов для мониторинга прода
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      expect_down:
        type: boolean
        required: false
        default: false
        description: "Known outage — skip the live checks"

permissions:
  contents: read

jobs:
  validate-prod:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pytest-playwright
          playwright install chromium

      - name: Record what the edge serves
        env:
          PROD_URL: https://tippy-egi.pages.dev
        run: |
          {
            echo "## Live edge (both paths must answer 200)"
            echo ""
            echo "| Path | HTTP |"
            echo "| --- | --- |"
            for path in / /api/health; do
              if ! code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${PROD_URL}${path}"); then
                code="unreachable"
              fi
              echo "| \`${path}\` | ${code} |"
            done
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run Production Validation Tests
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.expect_down != 'true'
        env:
          PYTEST_ADDOPTS: "-v --tb=short"
        run: |
          pytest tests/test_production_health.py tests/test_production_design.py -m production

      - name: Note the suppressed run
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.expect_down == 'true'
        run: |
          echo "::notice::The live checks did not run: dispatched with expect_down=true."
          {
            echo "### Validation skipped by hand"
            echo ""
            echo "Dispatched with \`expect_down=true\`, so no request reached the live site."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report failure
        if: failure()
        run: |
          echo "⚠️ Прод-валидация не пройдена! Проверьте https://tippy-egi.pages.dev"
