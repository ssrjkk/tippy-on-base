name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Pinned instead of ubuntu-latest: GitHub moves that label to Ubuntu 26 on
# 2026-10-19, and a runner image swap should not be something CI discovers on
# an unrelated push.
jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.16.4
      - name: Ruff check (bot web tests deploy agent scripts)
        run: ruff check bot web tests deploy agent scripts

  test:
    name: Tests (pytest)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tipbot
          POSTGRES_PASSWORD: tipbot
          POSTGRES_DB: tipbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tipbot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      BOT_TOKEN: "0123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghi"
      HOT_WALLET_KEY: "0x1111111111111111111111111111111111111111111111111111111111111111"
      WALLET_ENC_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      SECRET_KEY: "test-secret-key-for-ci-only-32ch!"
      TEST_DATABASE_URL: "postgresql://tipbot:tipbot@localhost:5432/tipbot_test"
      TEST_ADMIN_DATABASE_URL: "postgresql://tipbot:tipbot@localhost:5432/postgres"
      # bot/ledger/ opens its module-level singleton at import time, so the
      # pytest job must point DATABASE_URL at the service database (5432) too —
      # the 5433 default would fail the import before any test runs.
      DATABASE_URL: "postgresql://tipbot:tipbot@localhost:5432/tipbot"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Install solc 0.8.24 (EVM contract tests)
        run: python -c "import solcx; solcx.install_solc('0.8.24')"
      - name: Vendor contract dependencies (OZ/prb-math for EVM tests)
        run: bash scripts/setup_foundry.sh
      - name: Run tests
        run: python -m pytest -q

  security:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  contract:
    name: Contracts (forge test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
      - name: Vendor contract dependencies
        run: bash scripts/setup_foundry.sh
      - name: Forge build
        run: forge build
      - name: Forge test
        run: forge test -vvv
