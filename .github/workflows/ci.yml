name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Pinned instead of ubuntu-latest: GitHub moves that label to Ubuntu 26 on
# 2026-10-19, and a runner image swap should not be something CI discovers on
# an unrelated push.
jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.16.4
      - name: Ruff check (bot web tests deploy agent scripts)
        run: ruff check bot web tests deploy agent scripts

  test:
    name: Tests (pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tipbot
          POSTGRES_PASSWORD: tipbot
          POSTGRES_DB: tipbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tipbot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      BOT_TOKEN: "0123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghi"
      HOT_WALLET_KEY: "0x1111111111111111111111111111111111111111111111111111111111111111"
      WALLET_ENC_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      SECRET_KEY: "test-secret-key-for-ci-only-32ch!"
      TEST_DATABASE_URL: "postgresql://tipbot:tipbot@localhost:5432/tipbot_test"
      TEST_ADMIN_DATABASE_URL: "postgresql://tipbot:tipbot@localhost:5432/postgres"
      # tests/conftest.py pins DATABASE_URL to TEST_DATABASE_URL before anything
      # imports bot.* — bot/ledger/ builds a Ledger() at import time and its
      # constructor runs `alembic upgrade head`, so an unpinned value would make
      # the suite migrate whatever database the environment happened to point at.
      # This value is what a bare import outside the suite would use, so it
      # points at the test database too.
      DATABASE_URL: "postgresql://tipbot:tipbot@localhost:5432/tipbot_test"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Install solc 0.8.24 (EVM contract tests)
        run: python -c "import solcx; solcx.install_solc('0.8.24')"
      - name: Vendor contract dependencies (OZ/prb-math for EVM tests)
        run: bash scripts/setup_foundry.sh
      - name: Run tests
        run: python -m pytest -q -m "not production"

  security:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  contract:
    name: Contracts (forge test)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf
      - name: Vendor contract dependencies
        run: bash scripts/setup_foundry.sh
      - name: Forge build
        run: forge build
      - name: Forge test
        run: forge test -vvv
